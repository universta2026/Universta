services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: abroad
      POSTGRES_PASSWORD: abroad_pw
      POSTGRES_DB: abroad
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  directus:
    image: directus/directus:11
    ports: ["8055:8055"]
    depends_on: [db]
    environment:
      KEY: "xyz-1223-abc-hdsdkdskdskd-ksjdksj"
      SECRET: "ddsdjksjdkskdkd-hsjdsjdj-ksjdksj"
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: abroad
      DB_USER: abroad
      DB_PASSWORD: abroad_pw
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: 123456789

volumes:
  pgdata: